name: Build Windows installer

# Every push to main builds UpSpace-Setup.exe (download it from the run's "Artifacts").
# Pushing a version tag like v1.2 also publishes it as a GitHub Release with a fixed download link.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover tests
      - name: Build UpSpace.exe
        run: python -m PyInstaller --noconfirm --windowed --name UpSpace --icon assets/upspace.ico --collect-data customtkinter --add-data "assets;assets" main.py
      - name: Install NSIS (if the runner doesn't have it)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $nsisArgs = @()
          if ("${{ github.ref_type }}" -eq "tag") { $nsisArgs += "/DAPPVER=$("${{ github.ref_name }}".TrimStart('v'))" }
          & $makensis @args installer/upspace.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: UpSpace-Setup
          path: dist/UpSpace-Setup.exe
      - name: Publish Release (version tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UpSpace-Setup.exe
          generate_release_notes: true
